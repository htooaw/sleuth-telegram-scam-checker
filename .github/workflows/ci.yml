name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # ---------- CI: check every pull request ----------

      - name: Build the Docker image
        run: docker build -t risk-assessor .

      - name: Check all manager files import without errors
        run: docker run --rm risk-assessor python -c "import ai_manager, data_manager, io_manager, logic_manager, main"

      - name: Run the tests inside Docker
        run: docker run --rm risk-assessor python -m pytest -q

      - name: Check the frontend starts
        run: |
          docker run -d --name app -p 8501:8501 risk-assessor
          for i in $(seq 1 20); do
            curl -fs http://localhost:8501/_stcore/health && exit 0
            sleep 2
          done
          docker logs app
          exit 1

      # ---------- CD: publish the image after every merge to main ----------

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish the Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          SHORT_SHA="$(echo "$GITHUB_SHA" | cut -c1-7)"
          docker tag risk-assessor "$IMAGE:latest"
          docker tag risk-assessor "$IMAGE:$SHORT_SHA"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$SHORT_SHA"
          echo "Published $IMAGE:latest and $IMAGE:$SHORT_SHA"
